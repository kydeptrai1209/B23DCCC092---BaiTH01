<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg1)"/>
  <circle cx="500" cy="80" r="140" fill="#4338ca" opacity="0.4" filter="blur(30px)"/>
  <circle cx="100" cy="300" r="100" fill="#a855f7" opacity="0.3" filter="blur(30px)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 45)" filter="url(#dropshadow)">
    <rect width="480" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Browser Top Bar -->
    <rect width="480" height="36" rx="12" fill="#1e293b"/>
    <path d="M0 24 h480 v12 h-480 z" fill="#1e293b"/>
    <!-- Window buttons -->
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <!-- Address Bar -->
    <rect x="75" y="9" width="330" height="18" rx="9" fill="#0f172a"/>
    <text x="240" y="22" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">https://xuan-ky.dev/portfolio</text>

    <!-- Page Content Mockup -->
    <!-- Nav -->
    <rect x="25" y="55" width="60" height="12" rx="4" fill="#6366f1"/>
    <rect x="350" y="57" width="25" height="8" rx="2" fill="#475569"/>
    <rect x="385" y="57" width="25" height="8" rx="2" fill="#475569"/>
    <rect x="420" y="57" width="35" height="14" rx="4" fill="#a855f7"/>

    <!-- Hero Content -->
    <rect x="30" y="90" width="130" height="16" rx="4" fill="url(#glow1)"/>
    <rect x="30" y="115" width="200" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="30" y="132" width="170" height="8" rx="3" fill="#64748b"/>
    <rect x="30" y="146" width="150" height="8" rx="3" fill="#64748b"/>

    <rect x="30" y="170" width="70" height="24" rx="6" fill="#6366f1"/>
    <rect x="110" y="170" width="70" height="24" rx="6" fill="#334155"/>

    <!-- Avatar circle in mockup -->
    <circle cx="370" cy="135" r="45" fill="url(#glow1)" opacity="0.3"/>
    <circle cx="370" cy="135" r="35" fill="#38bdf8"/>

    <!-- Cards below -->
    <rect x="30" y="215" width="130" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <rect x="175" y="215" width="130" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <rect x="320" y="215" width="130" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  </g>
</svg>
