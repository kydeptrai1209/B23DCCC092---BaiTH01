<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="pipeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="dropshadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg4)"/>
  <circle cx="150" cy="180" r="100" fill="#3b82f6" opacity="0.2" filter="blur(25px)"/>
  <circle cx="450" cy="180" r="100" fill="#ec4899" opacity="0.2" filter="blur(25px)"/>

  <!-- ETL Pipeline Mockup -->
  <g transform="translate(60, 45)" filter="url(#dropshadow4)">
    <rect width="480" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect width="480" height="36" rx="12" fill="#1e293b"/>
    <path d="M0 24 h480 v12 h-480 z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="80" y="22" font-family="'Courier New', monospace" font-size="11" fill="#ec4899" font-weight="bold">data-pipeline-orchestrator // status: RUNNING (120k msgs/s)</text>

    <!-- Step 1: Ingestion -->
    <rect x="25" y="85" width="105" height="95" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="77" y="115" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#60a5fa" text-anchor="middle">EXTRACT</text>
    <text x="77" y="132" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">REST APIs</text>
    <text x="77" y="146" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Kafka Logs</text>
    <rect x="40" y="157" width="75" height="12" rx="3" fill="#1e3a8a"/>
    <text x="77" y="166" font-family="'Segoe UI', sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">In: 24.5 MB/s</text>

    <!-- Connector 1 -->
    <line x1="130" y1="132" x2="185" y2="132" stroke="url(#pipeGlow)" stroke-width="4" stroke-dasharray="6 3"/>

    <!-- Step 2: Processing -->
    <rect x="185" y="85" width="110" height="95" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="240" y="115" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#a78bfa" text-anchor="middle">TRANSFORM</text>
    <text x="240" y="132" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Validation</text>
    <text x="240" y="146" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Aggregations</text>
    <rect x="202" y="157" width="75" height="12" rx="3" fill="#4c1d95"/>
    <text x="240" y="166" font-family="'Segoe UI', sans-serif" font-size="8" fill="#ddd6fe" text-anchor="middle">Latency: 12ms</text>

    <!-- Connector 2 -->
    <line x1="295" y1="132" x2="350" y2="132" stroke="url(#pipeGlow)" stroke-width="4" stroke-dasharray="6 3"/>

    <!-- Step 3: Warehouse / Destination -->
    <rect x="350" y="85" width="105" height="95" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="402" y="115" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">LOAD</text>
    <text x="402" y="132" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PostgreSQL</text>
    <text x="402" y="146" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Data Lake</text>
    <rect x="365" y="157" width="75" height="12" rx="3" fill="#831843"/>
    <text x="402" y="166" font-family="'Segoe UI', sans-serif" font-size="8" fill="#fbcfe8" text-anchor="middle">Success: 99.9%</text>

    <!-- Bottom Metrics -->
    <rect x="25" y="210" width="430" height="42" rx="6" fill="#1e293b"/>
    <text x="40" y="235" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8">[CRON JOB 00:00] Batch #881 completed cleanly. 1,420,000 records processed.</text>
  </g>
</svg>
