<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="dropshadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg3)"/>
  <circle cx="100" cy="80" r="130" fill="#3b82f6" opacity="0.25" filter="blur(30px)"/>
  <circle cx="500" cy="280" r="120" fill="#f59e0b" opacity="0.25" filter="blur(30px)"/>

  <!-- Decision Tree Visualization Mockup -->
  <g transform="translate(60, 45)" filter="url(#dropshadow3)">
    <rect width="480" height="270" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="480" height="36" rx="12" fill="#1e293b"/>
    <path d="M0 24 h480 v12 h-480 z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="80" y="22" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b" font-weight="bold">DecisionTreeClassifier - Accuracy: 84.2%</text>

    <!-- Tree Root Node -->
    <rect x="180" y="55" width="120" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="240" y="70" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Sex &lt;= 0.5 (Female)</text>
    <text x="240" y="82" font-family="'Courier New', monospace" font-size="8" fill="#93c5fd" text-anchor="middle">gini = 0.473 | samples = 891</text>

    <!-- Branch Lines -->
    <line x1="220" y1="89" x2="130" y2="125" stroke="#64748b" stroke-width="2"/>
    <line x1="260" y1="89" x2="350" y2="125" stroke="#64748b" stroke-width="2"/>

    <!-- Left Child: Female -->
    <rect x="70" y="125" width="120" height="34" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="140" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Pclass &lt;= 2.5</text>
    <text x="130" y="152" font-family="'Courier New', monospace" font-size="8" fill="#a7f3d0" text-anchor="middle">Survived: 74.2%</text>

    <!-- Right Child: Male -->
    <rect x="290" y="125" width="120" height="34" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="350" y="140" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Age &lt;= 9.5</text>
    <text x="350" y="152" font-family="'Courier New', monospace" font-size="8" fill="#fecdd3" text-anchor="middle">Survived: 18.9%</text>

    <!-- Sub-branches -->
    <line x1="110" y1="159" x2="70" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="150" y1="159" x2="190" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="330" y1="159" x2="290" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="370" y1="159" x2="410" y2="190" stroke="#64748b" stroke-width="1.5"/>

    <!-- Leaves -->
    <rect x="25" y="190" width="90" height="26" rx="4" fill="#047857"/>
    <text x="70" y="206" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" text-anchor="middle">1st/2nd Class: Live</text>

    <rect x="145" y="190" width="90" height="26" rx="4" fill="#991b1b"/>
    <text x="190" y="206" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" text-anchor="middle">3rd Fare &gt; 23</text>

    <rect x="245" y="190" width="90" height="26" rx="4" fill="#047857"/>
    <text x="290" y="206" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" text-anchor="middle">Children: Live</text>

    <rect x="365" y="190" width="90" height="26" rx="4" fill="#991b1b"/>
    <text x="410" y="206" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" text-anchor="middle">Adult Male: Perish</text>

    <!-- Metrics Bar -->
    <rect x="25" y="235" width="430" height="24" rx="4" fill="#1e293b"/>
    <text x="35" y="251" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8">Precision: 0.83 | Recall: 0.81 | F1-Score: 0.82 | ROC-AUC: 0.88</text>
  </g>
</svg>
