<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dropshadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg2)"/>
  <circle cx="120" cy="90" r="130" fill="#0d9488" opacity="0.3" filter="blur(30px)"/>
  <circle cx="500" cy="270" r="120" fill="#0891b2" opacity="0.3" filter="blur(30px)"/>

  <!-- Network Diagram / Packet Analyzer Mockup -->
  <g transform="translate(60, 45)" filter="url(#dropshadow2)">
    <rect width="480" height="270" rx="12" fill="#0f172a" stroke="#1e3a3a" stroke-width="2"/>
    <rect width="480" height="36" rx="12" fill="#112229"/>
    <path d="M0 24 h480 v12 h-480 z" fill="#112229"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="80" y="22" font-family="'Courier New', monospace" font-size="11" fill="#2dd4bf" font-weight="bold">wireshark-multicast-analyzer // UDP 224.1.1.1:5000</text>

    <!-- Network Topology Graph -->
    <!-- Producer Node -->
    <circle cx="110" cy="115" r="30" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
    <text x="110" y="112" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">PRODUCER</text>
    <text x="110" y="125" font-family="'Courier New', monospace" font-size="9" fill="#99f6e4" text-anchor="middle">192.168.1.10</text>

    <!-- Receiver Nodes -->
    <circle cx="370" cy="80" r="26" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="370" y="78" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">CLIENT 1</text>
    <text x="370" y="90" font-family="'Courier New', monospace" font-size="8" fill="#a5f3fc" text-anchor="middle">Group Member</text>

    <circle cx="370" cy="140" r="26" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="370" y="138" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">CLIENT 2</text>
    <text x="370" y="150" font-family="'Courier New', monospace" font-size="8" fill="#a5f3fc" text-anchor="middle">Group Member</text>

    <circle cx="370" cy="200" r="26" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="370" y="198" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle">CLIENT 3</text>
    <text x="370" y="210" font-family="'Courier New', monospace" font-size="8" fill="#a5f3fc" text-anchor="middle">Group Member</text>

    <!-- Multicast Connection Lines -->
    <line x1="140" y1="115" x2="344" y2="80" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="140" y1="115" x2="344" y2="140" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="140" y1="115" x2="344" y2="200" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Packet Stream Indicator -->
    <rect x="25" y="235" width="430" height="24" rx="4" fill="#112229"/>
    <text x="35" y="251" font-family="'Courier New', monospace" font-size="10" fill="#2dd4bf">[IGMP v2] Joined 224.1.1.1 | Packet #1042 Sent | Loss: 0% | Synced</text>
  </g>
</svg>
