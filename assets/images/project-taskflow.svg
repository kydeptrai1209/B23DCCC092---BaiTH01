<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="dropshadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bg5)"/>
  <circle cx="100" cy="100" r="100" fill="#3b82f6" opacity="0.2" filter="blur(25px)"/>
  <circle cx="500" cy="250" r="100" fill="#10b981" opacity="0.2" filter="blur(25px)"/>

  <!-- Kanban Board Mockup -->
  <g transform="translate(60, 45)" filter="url(#dropshadow5)">
    <rect width="480" height="270" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2"/>
    <rect width="480" height="36" rx="12" fill="#1e293b"/>
    <path d="M0 24 h480 v12 h-480 z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f8fafc" font-weight="bold">TaskFlow Pro // Kanban Board</text>

    <!-- Column 1: To Do -->
    <rect x="20" y="55" width="135" height="195" rx="6" fill="#1e293b"/>
    <circle cx="35" cy="70" r="4" fill="#94a3b8"/>
    <text x="45" y="74" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">To Do (2)</text>
    <!-- Card 1 -->
    <rect x="28" y="88" width="119" height="50" rx="5" fill="#0f172a" stroke="#334155"/>
    <rect x="36" y="96" width="30" height="6" rx="2" fill="#ef4444"/>
    <text x="36" y="115" font-family="'Segoe UI', sans-serif" font-size="9" fill="#f1f5f9">Design DB schema</text>
    <text x="36" y="128" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">Due: Tomorrow</text>
    <!-- Card 2 -->
    <rect x="28" y="146" width="119" height="50" rx="5" fill="#0f172a" stroke="#334155"/>
    <rect x="36" y="154" width="30" height="6" rx="2" fill="#f59e0b"/>
    <text x="36" y="173" font-family="'Segoe UI', sans-serif" font-size="9" fill="#f1f5f9">OAuth2 login setup</text>
    <text x="36" y="186" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">Due: Oct 05</text>

    <!-- Column 2: In Progress -->
    <rect x="172" y="55" width="135" height="195" rx="6" fill="#1e293b"/>
    <circle cx="187" cy="70" r="4" fill="#3b82f6"/>
    <text x="197" y="74" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#93c5fd">In Progress (1)</text>
    <!-- Card 3 -->
    <rect x="180" y="88" width="119" height="65" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="188" y="96" width="40" height="6" rx="2" fill="#3b82f6"/>
    <text x="188" y="115" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#f1f5f9">Build Responsive UI</text>
    <text x="188" y="128" font-family="'Segoe UI', sans-serif" font-size="8" fill="#94a3b8">Progress: 85%</text>
    <rect x="188" y="136" width="103" height="4" rx="2" fill="#334155"/>
    <rect x="188" y="136" width="87" height="4" rx="2" fill="#3b82f6"/>

    <!-- Column 3: Done -->
    <rect x="325" y="55" width="135" height="195" rx="6" fill="#1e293b"/>
    <circle cx="340" cy="70" r="4" fill="#10b981"/>
    <text x="350" y="74" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7">Done (3)</text>
    <!-- Card 4 -->
    <rect x="333" y="88" width="119" height="45" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="341" y="108" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-decoration="line-through">Setup Git repository</text>
    <text x="341" y="122" font-family="'Segoe UI', sans-serif" font-size="8" fill="#10b981">✓ Completed</text>
    <!-- Card 5 -->
    <rect x="333" y="141" width="119" height="45" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="341" y="161" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-decoration="line-through">Wireframe design</text>
    <text x="341" y="175" font-family="'Segoe UI', sans-serif" font-size="8" fill="#10b981">✓ Completed</text>
  </g>
</svg>
