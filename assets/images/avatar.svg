<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b5" />
      <stop offset="100%" stop-color="#fbc090" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with subtle ring -->
  <circle cx="200" cy="200" r="190" fill="url(#avatar-bg)" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" stroke-dasharray="8 6"/>

  <g filter="url(#shadow)">
    <!-- Shoulders / Clothes -->
    <path d="M90 360 C100 280, 140 270, 200 270 C260 270, 300 280, 310 360 Z" fill="url(#shirt)"/>
    <path d="M175 270 L200 310 L225 270 Z" fill="#e2e8f0"/>
    <path d="M190 270 L200 285 L210 270 Z" fill="#cbd5e1"/>

    <!-- Neck -->
    <rect x="180" y="215" width="40" height="60" rx="8" fill="url(#skin)"/>

    <!-- Face -->
    <path d="M140 160 C140 230, 260 230, 260 160 C260 110, 140 110, 140 160 Z" fill="url(#skin)"/>

    <!-- Hair -->
    <path d="M130 155 C125 90, 170 70, 205 70 C250 70, 275 95, 270 155 C265 145, 255 125, 240 120 C220 125, 175 115, 160 128 C145 140, 135 150, 130 155 Z" fill="url(#hair)"/>

    <!-- Eyebrows -->
    <path d="M160 145 Q175 140 185 145" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M215 145 Q225 140 240 145" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Glasses Frame -->
    <rect x="152" y="150" width="38" height="28" rx="6" fill="rgba(255,255,255,0.4)" stroke="#0f172a" stroke-width="3"/>
    <rect x="210" y="150" width="38" height="28" rx="6" fill="rgba(255,255,255,0.4)" stroke="#0f172a" stroke-width="3"/>
    <line x1="190" y1="162" x2="210" y2="162" stroke="#0f172a" stroke-width="3"/>
    <line x1="140" y1="160" x2="152" y2="160" stroke="#0f172a" stroke-width="3"/>
    <line x1="248" y1="160" x2="260" y2="160" stroke="#0f172a" stroke-width="3"/>

    <!-- Eyes -->
    <circle cx="171" cy="164" r="4" fill="#0f172a"/>
    <circle cx="229" cy="164" r="4" fill="#0f172a"/>
    <circle cx="173" cy="162" r="1.5" fill="#ffffff"/>
    <circle cx="231" cy="162" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M198 175 L202 185 L196 187" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Smile -->
    <path d="M185 200 Q200 215 215 200" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Code badges floating -->
    <g transform="translate(45, 120)">
      <circle cx="25" cy="25" r="25" fill="#ffffff" filter="url(#shadow)"/>
      <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="15" fill="#e44d26" text-anchor="middle">&lt;/&gt;</text>
    </g>

    <g transform="translate(305, 130)">
      <circle cx="25" cy="25" r="25" fill="#ffffff" filter="url(#shadow)"/>
      <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" fill="#f7df1e" text-anchor="middle">JS</text>
    </g>

    <g transform="translate(60, 250)">
      <circle cx="22" cy="22" r="22" fill="#ffffff" filter="url(#shadow)"/>
      <text x="22" y="27" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#2563eb" text-anchor="middle">CSS</text>
    </g>

    <g transform="translate(295, 245)">
      <circle cx="22" cy="22" r="22" fill="#ffffff" filter="url(#shadow)"/>
      <text x="22" y="28" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14" fill="#3b82f6" text-anchor="middle">Py</text>
    </g>
  </g>
</svg>
